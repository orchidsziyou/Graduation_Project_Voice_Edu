spring.application.name=voice-edu

# 文件编码方式
spring.messages.encoding=UTF-8
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

langchain4j.dashscope.chat-model.api-key=your-api-key-here

# JVM系统属性
-Dfile.encoding=UTF-8


# llm配置

langchain4j.dashscope.chat-model.model-name=qwen-plus
langchain4j.dashscope.chat-model.temperature=0.7
langchain4j.dashscope.chat-model.timeout=60s

langchain4j.open-ai.chat-model.api-key=your-openai-api-key-here
langchain4j.open-ai.chat-model.model-name=gpt-3.5-turbo
langchain4j.open-ai.chat-model.temperature=0.7
langchain4j.open-ai.chat-model.timeout=60s

langchain4j.default-model-provider=dashscope

server.port=8080

spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB
spring.servlet.multipart.location=${java.io.tmpdir}
spring.servlet.multipart.enabled=true
spring.servlet.multipart.resolve-lazily=false

#上传文件路径
file.upload.path=D:/Homework/Final_Project/uploads/

# 科大讯飞配置
xfyun.app-id=your-openai-api-key-here
xfyun.access-key-id=your-openai-api-key-here
xfyun.access-key-secret=your-openai-api-key-here
xfyun.api-base-url=https://office-api-ist-dx.iflyaisol.com

## 识别完语言之后，发送给LLM的提示词前缀（前缀 + 语言识别到的内容）
#speech.recognition.prompt-prefix=你是一个评论员，你需要从后面我发送的内容里面，猜测我当时是什么心情，并且返回结果。
#


# 登录功能配置
app.login.enabled=true

# JWT 配置
jwt.secret=mySecretKeyForJWTTokenGenerationWhichIsVeryLongAndSecure123456789
jwt.expiration=86400000

# 数据库配置（H2文件数据库）
spring.datasource.url=jdbc:h2:file:./data/testdb;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.h2.console.settings.web-allow-others=true

# Vosk 语音识别模型配置
vosk.model.path=src/main/resources/models/vosk-model-cn