<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI处理结果</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 900px;
            margin: 30px auto;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .container {
            background-color: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
        }
        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 25px;
            font-size: 28px;
            position: relative;
        }
        h1:after {
            content: '';
            display: block;
            width: 80px;
            height: 4px;
            background: linear-gradient(45deg, #4CAF50, #45a049);
            margin: 15px auto;
            border-radius: 2px;
        }
        .operation-tag {
            display: inline-block;
            background: linear-gradient(45deg, #4CAF50, #45a049);
            color: white;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 20px;
        }
        .result-section {
            margin: 25px 0;
        }
        .section-title {
            font-size: 20px;
            color: #2e7d32;
            margin-bottom: 15px;
            font-weight: 600;
            display: flex;
            align-items: center;
        }
        .section-title:before {
            content: '🤖';
            margin-right: 10px;
            font-size: 24px;
        }
        .input-box {
            background-color: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            border-left: 4px solid #2196F3;
            margin: 15px 0;
        }
        .result-box {
            background: linear-gradient(135deg, #e8f5e8 0%, #c8e6c9 100%);
            padding: 25px;
            border-radius: 12px;
            margin: 20px 0;
            border-left: 5px solid #4CAF50;
            box-shadow: 0 5px 15px rgba(76, 175, 80, 0.1);
        }
        .data-display {
            font-size: 16px;
            color: #333;
            line-height: 1.6;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        .button-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 30px;
        }
        .btn {
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 500;
            text-decoration: none;
            display: inline-block;
            transition: all 0.3s;
            text-align: center;
        }
        .btn-primary {
            background: linear-gradient(45deg, #2196F3, #1976D2);
            color: white;
        }
        .btn-success {
            background: linear-gradient(45deg, #4CAF50, #45a049);
            color: white;
        }
        .btn-secondary {
            background: linear-gradient(45deg, #9e9e9e, #757575);
            color: white;
        }
        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        }
        .ai-icon {
            font-size: 24px;
            margin-right: 10px;
            vertical-align: middle;
        }
        .timestamp {
            text-align: center;
            color: #757575;
            font-size: 14px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>
            <span class="ai-icon">🤖</span>
            AI智能处理完成
        </h1>
        
        <div style="text-align: center;">
            <span class="operation-tag" th:text="${operation}">处理操作</span>
        </div>
        
        <div class="result-section">
            <div class="section-title">您的输入内容</div>
            <div class="input-box">
                <p class="data-display" th:text="${inputData}"></p>
            </div>
        </div>
        
        <div class="result-section">
            <div class="section-title">AI处理结果</div>
            <div class="result-box">
                <p class="data-display" th:text="${message}"></p>
            </div>
        </div>
        
        <div class="button-group">
            <a href="/" class="btn btn-primary">🏠 返回首页</a>
            <a href="javascript:history.back()" class="btn btn-secondary">🔙 返回上页</a>
        </div>
        
        <div class="timestamp">
            处理时间: <span th:text="${#dates.format(new java.util.Date(), 'yyyy-MM-dd HH:mm:ss')}"></span>
        </div>
    </div>
</body>
</html>
