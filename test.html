<!DOCTYPE html>
<html>
<head>
    <title>测试页面</title>
</head>
<body>
    <h1>JavaScript功能测试</h1>
    <textarea id="inputData" placeholder="输入测试内容"></textarea>
    <br><br>
    <button onclick="testFunction()">测试发送功能</button>
    <div id="result"></div>

    <script>
        function testFunction() {
            const inputElement = document.getElementById('inputData');
            const message = inputElement.value.trim();
            
            if (!message) {
                document.getElementById('result').innerHTML = '<p style="color: red;">请输入内容！</p>';
                return;
            }
            
            document.getElementById('result').innerHTML = '<p>正在发送: ' + message + '</p>';
            
            // 测试API调用
            fetch('/api/chat/send', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    message: message
                })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    document.getElementById('result').innerHTML = '<p style="color: green;">成功: ' + data.response + '</p>';
                } else {
                    document.getElementById('result').innerHTML = '<p style="color: red;">失败: ' + data.message + '</p>';
                }
            })
            .catch(error => {
                document.getElementById('result').innerHTML = '<p style="color: red;">错误: ' + error.message + '</p>';
            });
        }
    </script>
</body>
</html>
